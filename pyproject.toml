[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "momentfm"
version = "0.1.5"
dependencies = [
  "huggingface-hub>=0.34,<1",
  "numpy>=1.26,<3",
  "safetensors>=0.4.3,<1",
  "torch==2.8.0",
  "transformers>=4.55.4,<4.56",
]

requires-python = ">=3.11,<3.13"

authors = [
  {name = "Mononito Goswami", email = "mononitog@hotmail.com"},
  {name = "Konrad Szafer"},
  {name = "Arjun Choudhry"},
  {name = "Yifu Cai"},
]

maintainers = [
  {name = "Mononito Goswami", email = "mononitog@hotmail.com"},
  {name = "Konrad Szafer", email = "szafer.konrad@gmail.com"},
  {name = "Yifu Cai", email = "yifuc@andrew.cmu.edu"},
  {name = "Michal Wilinski", email = "mwilisk@andrew.cmu.edu"},
]

description = "MOMENT: A Family of Open Time Series Foundation Models"
readme = "README.md"
license = {file = "LICENSE"}

keywords = [
    "time series", 
    "forecasting", 
    "classification",
    "imputation", 
    "anomaly detection",  
    "transformers", 
    "pytorch", 
    "huggingface", 
    "moment",
    "foundation models",
    "large language models",
    ]

classifiers = [
  "Programming Language :: Python"
]

[project.urls]
Homepage = "https://moment-timeseries-foundation-model.github.io/"
Repository = "https://github.com/moment-timeseries-foundation-model/moment"
"Bug Tracker" = "https://github.com/moment-timeseries-foundation-model/moment/issues"

[project.optional-dependencies]
# Select one backend on Linux; macOS uses the native PyPI wheel.
cpu = ["torch==2.8.0"]
cu128 = ["torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]
data = [
  "joblib>=1.3,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "tqdm>=4.66,<5",
]
notebooks = [
  "momentfm[data]",
  "ipykernel>=6.29,<7",
  "ipywidgets>=8.1,<9",
  "matplotlib>=3.8,<4",
  "notebook>=7,<8",
]
finetune = [
  "momentfm[data]",
  "accelerate>=1.10,<2",
  "peft>=0.17.1,<0.18",
  "wfdb>=4.2,<5",
]
distributed = [
  "momentfm[finetune]",
  "deepspeed>=0.18,<0.19; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
required-version = ">=0.9.27"
default-groups = []
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
# The upstream tests/test_inference.py downloads several pretrained models.
# Keep ordinary dependency checks offline and small; run it explicitly if needed.
testpaths = ["tests"]
addopts = "-m 'not pretrained'"
markers = ["pretrained: downloads and runs official pretrained model weights"]

[tool.hatch.build.targets.wheel]
packages = ["momentfm"]

[tool.hatch.build.targets.sdist]
exclude = ["/.idea", "/experiments", "/.venv"]
